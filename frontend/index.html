<!DOCTYPE html>
<html>
<body>
  <h2>Hello test</h2>
  <button onclick="run()">Call backend</button>
  <pre id="out"></pre>
  <script>
    async function run() {
      const out = document.getElementById("out");
      out.textContent = "Loading... (the first call can take up to a minute)";
      try {
        const r = await fetch("https://hello-test-aymj.onrender.com");
        const d = await r.json();
        out.textContent = JSON.stringify(d, null, 2);
      } catch (e) {
        out.textContent = "Error: " + e;
      }
    }
  </script>
</body>
</html>
